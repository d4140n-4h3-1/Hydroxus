[package]
name = "fyrox-graphics-wgpu"
version = "2.0.0-rc.1"
edition = "2021"
license = "MIT"
description = "Wgpu-based graphics server for Fyrox Game Engine"
keywords = ["graphics", "gapi"]
categories = ["graphics", "rendering::graphics-api"]
include = ["/src/**/*", "/Cargo.toml", "/LICENSE", "/README.md"]
homepage = "https://fyrox.rs"
documentation = "https://docs.rs/fyrox-graphics-wgpu"
repository = "https://github.com/FyroxEngine/Fyrox"
rust-version = "1.87"

[dependencies]
winit = { version = "0.30" }
fyrox-graphics = { version = "2.0.0-rc.1", path = "../fyrox-graphics" }
fyrox-core = { version = "2.0.0-rc.1", path = "../fyrox-core" }
wgpu = { version = "30.0.0" }
# Uniform and vertex data for the ray tracing pass is written as plain bytes.
bytemuck = { version = "1", features = ["derive"] }
# Yoctite's clusters and levels of detail, built on the CPU, kept on the GPU by `yoctite`.
yoctite = { version = "0.1.0", path = "../yoctite" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = "0.6"
