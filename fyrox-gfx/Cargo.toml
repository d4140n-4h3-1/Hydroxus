[package]
name = "fyrox-gfx"
version = "0.1.0"
edition = "2021"
description = "Graphics improvements for Fyrox that live outside the engine core: refractive glass, and more to come."
license = "MIT"

[dependencies]
# The wind offsets of meshes that bend are kept as half floats (Yoctite, traced shadows).
half = "2.2.1"
# No default features: the game using this crate decides between OpenGL and wgpu (Vulkan).
fyrox = { version = "2.0.0-rc.1", path = "../fyrox", default-features = false }

# Ray tracing lives in the wgpu backend, because that is where the device and the acceleration
# structures are. Games on OpenGL simply do not enable this feature.
fyrox-graphics-wgpu = { version = "2.0.0-rc.1", path = "../fyrox-graphics-wgpu", optional = true }
# Yoctite (clusters and levels of detail, and their GPU side) and Candelite (global illumination)
# live in their own repository: github.com/d4140n-4h3-1/yoctite-candelite.
yoctite = { git = "https://github.com/d4140n-4h3-1/yoctite-candelite.git", branch = "main", optional = true }
yoctite-wgpu = { git = "https://github.com/d4140n-4h3-1/yoctite-candelite.git", branch = "main", optional = true }
candelite = { git = "https://github.com/d4140n-4h3-1/yoctite-candelite.git", branch = "main", optional = true }
# The engine's own wgpu, to ask the card what it can do before Yoctite and Candelite start, and
# to draw the grass with.
wgpu = { version = "30.0.0", optional = true }
# The grass's uniforms, as bytes for the GPU.
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
raytracing = ["dep:fyrox-graphics-wgpu", "dep:yoctite", "dep:yoctite-wgpu", "dep:candelite", "dep:wgpu", "dep:bytemuck", "fyrox/backend_wgpu"]

[dev-dependencies]
fyrox = { version = "2.0.0-rc.1", path = "../fyrox", default-features = false, features = ["backend_wgpu"] }
fyrox-graphics-wgpu = { version = "2.0.0-rc.1", path = "../fyrox-graphics-wgpu" }

[[example]]
name = "glass"
required-features = []
